{{- if .Values.serviceAccounts.create }}
{{- $ns := include "ecommerce.namespace" . }}
{{- $saNames := list
  "api-gateway"
  "frontend"
  "product-service"
  "user-service"
  "cart-service"
  "order-service"
  "payment-service"
  "notification-service"
  "redis"
  "rabbitmq"
  "mailpit"
}}
{{- range $saNames }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecommerce.serviceAccountName" (dict "root" $ "name" .) }}
  namespace: {{ $ns }}
  labels:
    app: {{ . }}
    {{- include "ecommerce.labels" $ | nindent 4 }}
    app.kubernetes.io/component: serviceaccount
{{- end }}
{{- end }}
