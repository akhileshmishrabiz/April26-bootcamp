apiVersion: batch/v1
kind: Job
metadata:
  # Standalone/manual job. The Helm chart uses seed-data-job for its hook.
  name: seed-data-manual
  namespace: ecommerce
  labels:
    app: seed-data-manual
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: seed-data-manual
    spec:
      containers:
      - name: seed-data
        image: ms-ecom-seed:latest
        imagePullPolicy: Never
        env:
        - name: API_URL
          value: "http://api-gateway.ecommerce.svc.cluster.local"
        - name: SEED_PASSWORD
          value: "Password123!"
      restartPolicy: Never
