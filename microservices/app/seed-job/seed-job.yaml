apiVersion: batch/v1
kind: Job
metadata:
  name: seed-data-job
  namespace: ecommerce
  labels:
    app: seed-data-job
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: seed-data-job
    spec:
      containers:
      - name: seed-data
        image: ms-ecom-seed:latest
        imagePullPolicy: Never
        env:
        - name: API_URL
          value: "http://api-gateway.ecommerce.svc.cluster.local"
        - name: SEED_PASSWORD
          value: "Password123!"
      restartPolicy: Never
