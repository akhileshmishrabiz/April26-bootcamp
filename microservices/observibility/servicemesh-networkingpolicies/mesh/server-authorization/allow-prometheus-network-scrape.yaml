# Allow unmeshed Prometheus (monitoring namespace) to scrape /metrics on meshed pods.
# Complements MeshTLSAuthentication policies — Linkerd grants access if ANY policy matches.
# NetworkAuthentication covers the Kind pod CIDR where Prometheus runs.
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: monitoring-scrape-net
  namespace: ecommerce
spec:
  networks:
    - cidr: 192.168.0.0/16
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: product-service-prometheus-scrape
  namespace: ecommerce
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: product-service-http
  requiredAuthenticationRefs:
    - name: monitoring-scrape-net
      kind: NetworkAuthentication
      group: policy.linkerd.io
---
apiVersion: policy.linkerd.io/v1alpha1
