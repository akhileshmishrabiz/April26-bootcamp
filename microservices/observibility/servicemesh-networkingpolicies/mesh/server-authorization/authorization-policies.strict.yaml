# Strict AuthorizationPolicy — one MeshTLSAuthentication ref per policy (Linkerd requirement).
# Each MeshTLSAuthentication lists allowed caller ServiceAccounts (see meshed-auth.yaml).
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: product-service-authorized
  namespace: ecommerce
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: product-service-http
  requiredAuthenticationRefs:
    - name: product-service-callers
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
---
