# East-west calls and datastore access, matching the Helm chart:
#   cart        -> product-service:8001, redis:6379
#   order       -> product-service:8001, cart-service:8003, orders DB, rabbitmq:5672
#   payment     -> order-service:8004, payments DB
#   notification-> rabbitmq:5672, mailpit:1025
#   product     -> products DB
#   user        -> users DB
# CloudNativePG's operator (namespace cnpg-system) must reach instance pods on
# 5432 and the instance manager on 8000, or the clusters go unready.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-service-dependencies
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app: product-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cart-service
        - podSelector:
            matchLabels:
              app: order-service
      ports:
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: products
      ports:
        - protocol: TCP
          port: 5432
---
