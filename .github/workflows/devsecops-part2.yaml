name: DevSecOps Part 2

on:
  pull_request:
    branches:
      - main
    paths:
      - "devsecops/part2/**"
      - ".github/workflows/devsecops-part2.yaml"

permissions:
  contents: read

concurrency:
  group: devsecops-part2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: devsecops/part2
  IMAGE_NAME: devops-quest:${{ github.sha }}
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  code-quality:
    name: Code quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            devsecops/part2/requirements.txt
            devsecops/part2/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Run tests with coverage threshold
        run: >-
          pytest
          --cov=devops_quest
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part2-coverage
          path: devsecops/part2/coverage.xml
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency SCA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: devsecops/part2/requirements.txt

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0

      - name: Audit Python dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt --format=json --output=pip-audit.json

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part2-pip-audit
          path: devsecops/part2/pip-audit.json
          if-no-files-found: ignore

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan source and dependencies
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: devsecops/part2
          scanners: vuln
          format: sarif
          output: trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload filesystem scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part2-trivy-filesystem
          path: trivy-filesystem.sarif
          if-no-files-found: ignore

  app-secret-scan:
    name: Application secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan Part 2 for secrets
        continue-on-error: true
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --no-git --source=/repo/devsecops/part2 \
            --config=/repo/devsecops/part2/.gitleaks.toml \
            --report-format=json \
            --report-path=/repo/reports/part2-gitleaks.json

      - name: Upload secret report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part2-gitleaks
          path: reports/part2-gitleaks.json
          if-no-files-found: ignore

  dockerfile-checks:
    name: Dockerfile lint and config scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: devsecops/part2/Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: false

      - name: Scan Dockerfile configuration
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: devsecops/part2/Dockerfile
          format: sarif
          output: trivy-dockerfile.sarif
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Dockerfile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part2-dockerfile-reports
          path: |
            hadolint.sarif
            trivy-dockerfile.sarif
          if-no-files-found: ignore

  terraform-validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

  checkov:
    name: Checkov IaC findings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: devsecops/part2/infra
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,reports/checkov.sarif
          soft_fail: false

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part2-checkov
          path: reports/checkov.sarif
          if-no-files-found: ignore

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: Initialize TFLint
        run: tflint --init

      - name: Lint Terraform
        run: tflint --format compact

  infra-secret-scan:
    name: Scoped infrastructure secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan only Terraform files for secrets
        continue-on-error: true
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --no-git --source=/repo/devsecops/part2/infra \
            --report-format=json \
            --report-path=/repo/reports/infra-gitleaks.json

      - name: Upload infrastructure secret report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part2-infra-gitleaks
          path: reports/infra-gitleaks.json
          if-no-files-found: ignore

  container-build:
    name: Build container image
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - dockerfile-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag "${IMAGE_NAME}" "${APP_DIR}"

      - name: Export image
        run: docker save "${IMAGE_NAME}" | gzip > devops-quest-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: part2-container-image
          path: devops-quest-image.tar.gz
          retention-days: 1

  image-scan:
    name: Image scan and SBOM
    runs-on: ubuntu-latest
    needs: container-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: part2-container-image

      - name: Load image
        run: gunzip --stdout devops-quest-image.tar.gz | docker load

      - name: Scan image vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate CycloneDX SBOM
        if: always()
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload image reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part2-image-reports
          path: |
            trivy-image.sarif
            sbom.cdx.json
          if-no-files-found: ignore

  image-smoke-test:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: container-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: part2-container-image

      - name: Load image
        run: gunzip --stdout devops-quest-image.tar.gz | docker load

      - name: Verify health and core API behavior
        run: devsecops/part2/scripts/smoke-test.sh "${IMAGE_NAME}"

  required-gate:
    name: Required CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - code-quality
      - dependency-scan
      - filesystem-scan
      - app-secret-scan
      - dockerfile-checks
      - terraform-validate
      - checkov
      - tflint
      - infra-secret-scan
      - container-build
      - image-scan
      - image-smoke-test
    steps:
      - name: Enforce required outcomes
        env:
          CODE_QUALITY: ${{ needs.code-quality.result }}
          TERRAFORM_VALIDATE: ${{ needs.terraform-validate.result }}
          TFLINT: ${{ needs.tflint.result }}
          CONTAINER_BUILD: ${{ needs.container-build.result }}
          IMAGE_SCAN: ${{ needs.image-scan.result }}
          IMAGE_SMOKE_TEST: ${{ needs.image-smoke-test.result }}
        run: |
          required=(
            "code-quality=$CODE_QUALITY"
            "terraform-validate=$TERRAFORM_VALIDATE"
            "tflint=$TFLINT"
            "container-build=$CONTAINER_BUILD"
            "image-scan=$IMAGE_SCAN"
            "image-smoke-test=$IMAGE_SMOKE_TEST"
          )

          failed=0
          for outcome in "${required[@]}"; do
            echo "$outcome"
            if [[ "$outcome" != *=success ]]; then
              failed=1
            fi
          done

          if (( failed )); then
            echo "One or more required jobs did not succeed."
            exit 1
          fi

          echo "Required checks passed. Training scanners may still contain findings."
