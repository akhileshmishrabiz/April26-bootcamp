name: DevSecOps Part 2

on:
  pull_request:
    branches:
      - main
    paths:
      - "devsecops/part2/**"
      - ".github/workflows/devsecops-part2.yaml"

permissions:
  contents: read
  security-events: write

concurrency:
  group: devsecops-part2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: devsecops/part2
  IMAGE_NAME: devops-quest:${{ github.sha }}
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  code-quality:
    name: Code quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            devsecops/part2/requirements.txt
            devsecops/part2/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Run tests with coverage threshold
        run: >-
          pytest
          --cov=devops_quest
          --cov-report=term-missing
          --cov-fail-under=80

  codeql:
    name: CodeQL Python scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency SCA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: devsecops/part2/requirements.txt

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0

      - name: Audit Python dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan source and dependencies
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: devsecops/part2
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  app-secret-scan:
    name: Application secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan Part 2 for secrets
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --no-git --source=/repo/devsecops/part2 \
            --config=/repo/devsecops/part2/.gitleaks.toml

  dockerfile-checks:
    name: Dockerfile lint and config scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: devsecops/part2/Dockerfile
          format: tty
          no-fail: false

      - name: Scan Dockerfile configuration
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: devsecops/part2/Dockerfile
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"

  terraform-validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

  checkov:
    name: Checkov IaC findings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: devsecops/part2/infra
          framework: terraform
          output_format: cli
          soft_fail: false

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: Initialize TFLint
        run: tflint --init

      - name: Lint Terraform
        run: tflint --format compact

  infra-secret-scan:
    name: Scoped infrastructure secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan only Terraform files for secrets
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --no-git --source=/repo/devsecops/part2/infra

  container:
    name: Build, smoke test, and scan
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag "${IMAGE_NAME}" "${APP_DIR}"

      - name: Verify health and core API behavior
        run: devsecops/part2/scripts/smoke-test.sh "${IMAGE_NAME}"

      - name: Scan image vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  required-gate:
    name: Required CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - code-quality
      - dependency-scan
      - filesystem-scan
      - app-secret-scan
      - dockerfile-checks
      - terraform-validate
      - checkov
      - tflint
      - infra-secret-scan
      - container
    steps:
      - name: Enforce required outcomes
        env:
          CODE_QUALITY: ${{ needs.code-quality.result }}
          TERRAFORM_VALIDATE: ${{ needs.terraform-validate.result }}
          TFLINT: ${{ needs.tflint.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          required=(
            "code-quality=$CODE_QUALITY"
            "terraform-validate=$TERRAFORM_VALIDATE"
            "tflint=$TFLINT"
            "container=$CONTAINER"
          )

          failed=0
          for outcome in "${required[@]}"; do
            echo "$outcome"
            if [[ "$outcome" != *=success ]]; then
              failed=1
            fi
          done

          if (( failed )); then
            echo "One or more required jobs did not succeed."
            exit 1
          fi

          echo "Required checks passed. Training scanners may still contain findings."
