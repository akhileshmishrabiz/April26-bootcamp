name: Day 9 DevSecOps CI Pipeline

'on':
  pull_request:
    branches:
      - main
    paths:
      - "day9-ecs-terraform/**"
      - ".github/workflows/day9-devsecops.yaml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: day9-devsecops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: day9-ecs-terraform/src
  INFRA_DIR: day9-ecs-terraform/infra
  IMAGE_NAME: ecs-day9-portal:${{ github.sha }}
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.12.1"

jobs:
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day9-ecs-terraform/src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            day9-ecs-terraform/src/requirements.txt
            day9-ecs-terraform/src/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Ruff linting
        run: ruff check .

      - name: Run Pytest with coverage
        run: >-
          pytest
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=70

  codeql:
    name: CodeQL Python SAST
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency SCA (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day9-ecs-terraform/src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: day9-ecs-terraform/src/requirements.txt

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0

      - name: Audit Python dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt

  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan source and dependencies
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_DIR }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  app-secret-scan:
    name: Application Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan application source for secrets
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --no-git --source=/repo/${{ env.APP_DIR }} \
            --config=/repo/day9-ecs-terraform/.gitleaks.toml

  dockerfile-checks:
    name: Dockerfile Lint & Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.APP_DIR }}/Dockerfile
          format: tty
          no-fail: false

      - name: Scan Dockerfile configuration with Trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: ${{ env.APP_DIR }}/Dockerfile
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day9-ecs-terraform/infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive || true

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

  checkov:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Checkov on Infrastructure
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.INFRA_DIR }}
          framework: terraform
          output_format: cli
          quiet: true
          soft_fail: true

  tflint:
    name: TFLint IaC Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day9-ecs-terraform/infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: Initialize TFLint
        run: tflint --init

      - name: Lint Terraform
        run: tflint --format compact

  infra-secret-scan:
    name: Infrastructure Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan Terraform files for secrets
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --no-git --source=/repo/${{ env.INFRA_DIR }}

  container:
    name: Build, Smoke Test & Image Scan
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag "${IMAGE_NAME}" "${APP_DIR}"

      - name: Execute Application Smoke Test
        run: day9-ecs-terraform/scripts/smoke-test.sh "${IMAGE_NAME}"

      - name: Scan container image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  required-gate:
    name: Required CI Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - code-quality
      - dependency-scan
      - filesystem-scan
      - app-secret-scan
      - dockerfile-checks
      - terraform-validate
      - checkov
      - tflint
      - infra-secret-scan
      - container
    steps:
      - name: Enforce required quality gate outcomes
        env:
          CODE_QUALITY: ${{ needs.code-quality.result }}
          TERRAFORM_VALIDATE: ${{ needs.terraform-validate.result }}
          TFLINT: ${{ needs.tflint.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          required=(
            "code-quality=$CODE_QUALITY"
            "terraform-validate=$TERRAFORM_VALIDATE"
            "tflint=$TFLINT"
            "container=$CONTAINER"
          )

          failed=0
          for outcome in "${required[@]}"; do
            echo "$outcome"
            if [[ "$outcome" != *=success ]]; then
              failed=1
            fi
          done

          if (( failed )); then
            echo "One or more required CI gate checks failed."
            exit 1
          fi

          echo "All mandatory CI quality gates passed successfully."
