# Docker image scan, Dockerfile scan, container scan, etc.

name: DevSecOps Part 1

on:
  push:
    branches:
      - main
    paths:
      - 'devsecops/part1/**'

jobs:
  infra-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Terraform code with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./devsecops/part1
          framework: terraform
          quiet: true
          output_format: json
          skip_check: CKV_AWS_18

