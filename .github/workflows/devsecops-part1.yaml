# Docker image scan, Dockerfile scan, container scan, etc.

name: DevSecOps Part 1

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'devsecops/part1/**'
  #     - '.github/workflows/devsecops-part1.yaml'
  workflow_dispatch:

jobs:
  infra-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Terraform code with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./devsecops/part1
          framework: terraform
          quiet: true
          output_format: json
          skip_check: CKV_AWS_18

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Initialize TFLint
        working-directory: ./devsecops/part1
        run: tflint --init

      - name: Run TFLint
        working-directory: ./devsecops/part1
        run: tflint

  docker-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./devsecops/part1/Dockerfile

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-part1:${{ github.sha }} \
            ./devsecops/part1

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-part1:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'