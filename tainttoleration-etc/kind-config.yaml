# Four nodes total: one control plane and three workers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: scheduling-demo
nodes:
  - role: control-plane

  - role: worker
    labels:
      demo-role: edge
      demo-workload: apps

  - role: worker
    labels:
      demo-role: general
      demo-workload: apps

  - role: worker
    labels:
      demo-role: restricted
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: dedicated
              value: payments
              effect: NoSchedule
