# Simple in-cluster MinIO for CNPG backups (demo only).
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: demo2-cnpg
type: Opaque
stringData:
  ACCESS_KEY_ID: minio
  SECRET_ACCESS_KEY: minio123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: demo2-cnpg
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-09-13T20-26-02Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: SECRET_ACCESS_KEY
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: demo2-cnpg
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
