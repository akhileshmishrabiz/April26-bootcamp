apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: demo-pg
  namespace: demo2-cnpg
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  storage:
    size: 1Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: appdb
      owner: appuser
      secret:
        name: demo-pg-app-user
  # Backups go to in-cluster MinIO (see backup.yaml)
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/
      endpointURL: http://minio:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: minio-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-pg-app-user
  namespace: demo2-cnpg
type: kubernetes.io/basic-auth
stringData:
  username: appuser
  password: demo-password
