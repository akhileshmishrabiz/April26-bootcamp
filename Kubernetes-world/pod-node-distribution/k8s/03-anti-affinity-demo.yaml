# Demo 3: Pod Anti-Affinity
#
# Two replicas refuse to share a node with another pod that has app=anti-affinity-demo.
# With two eligible worker nodes, each replica lands on a different node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anti-affinity-demo
  namespace: scheduling-demo
  labels:
    demo: pod-anti-affinity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anti-affinity-demo
  template:
    metadata:
      labels:
        app: anti-affinity-demo
        demo: pod-anti-affinity
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: anti-affinity-demo
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
