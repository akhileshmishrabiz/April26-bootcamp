apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-writer
  namespace: demo1-persistence
  labels:
    app: data-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-writer
  template:
    metadata:
      labels:
        app: data-writer
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /data
              echo "=== Pod started: ${POD_NAME} at $(date -u) ===" >> /data/events.log
              while true; do
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) | pod=${POD_NAME}" >> /data/events.log
                sleep 5
              done
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo1-claim
