# Demo-only RWX volume. Works on kind because every node bind-mounts the same
# host directory at /mnt/host-volume. In production use NFS, EFS, CephFS, etc.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-host
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: demo2-shared-volume
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-host
  hostPath:
    path: /mnt/host-volume/host-volume-data/demo2
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo2-shared-claim
  namespace: demo2-shared
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: local-host
  volumeName: demo2-shared-volume
  resources:
    requests:
      storage: 1Gi
