apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-writer
  namespace: demo2-shared
  labels:
    app: shared-writer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shared-writer
  template:
    metadata:
      labels:
        app: shared-writer
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /data/pods
              while true; do
                LINE="$(date -u +%Y-%m-%dT%H:%M:%SZ) | pod=${POD_NAME} | node=${NODE_NAME}"
                echo "${LINE}" >> /data/shared.log
                echo "${LINE}" > "/data/pods/${POD_NAME}.txt"
                sleep 5
              done
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: demo2-shared-claim
